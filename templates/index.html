<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natijalar</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #020818;
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  padding: 40px 20px;
}

.page-title {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 8px;
  color: #FFD700;
  text-shadow: 0 0 20px #FFD700, 0 0 60px #FFD70088;
  margin-bottom: 50px;
}

.section-title {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 5px;
  margin-bottom: 28px;
}
.section-title.gold { color: #FFD700AA; }
.section-title.blue { color: #00BFFF88; }

.teacher-section {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
  margin-bottom: 60px;
}

.gold-wrap { max-width: 400px; flex: 1 1 320px; }

.student-section {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 32px;
  max-width: 1200px;
  margin: 0 auto;
}

.blue-wrap { max-width: 300px; }

/* ── SPINNING BORDER ── */
.card-wrap {
  position: relative;
  border-radius: 16px;
  cursor: pointer;
  transition: transform 0.3s ease;
}
.card-wrap:hover { transform: translateY(-6px); }

.card-wrap .spinner {
  position: absolute;
  inset: -3px;
  border-radius: 18px;
  overflow: hidden;
  z-index: 0;
}
.card-wrap .spinner::before {
  content: '';
  position: absolute;
  inset: -80%;
}
.card-wrap .spinner::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 14px;
  background: #050d20;
}

.gold-wrap .spinner::before {
  background: conic-gradient(
    from 0deg,
    transparent 0deg, transparent 55deg,
    #B8860B 75deg, #FFD700 90deg,
    #FFF8A0 110deg, #FFD700 125deg,
    #B8860B 145deg, transparent 165deg,
    transparent 360deg
  );
  animation: spinBorder 2.5s linear infinite;
}

.blue-wrap .spinner::before {
  background: conic-gradient(
    from 0deg,
    transparent 0deg, transparent 55deg,
    #0066AA 75deg, #00BFFF 90deg,
    #87EEFF 110deg, #00BFFF 125deg,
    #0066AA 145deg, transparent 165deg,
    transparent 360deg
  );
  animation: spinBorder 3s linear infinite;
}

.gold-wrap:hover .spinner::before { animation-duration: 1.2s; }
.blue-wrap:hover .spinner::before { animation-duration: 1.5s; }

.card-inner {
  position: relative;
  z-index: 1;
  border-radius: 14px;
  background: #050d20;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.gold-wrap .card-inner {
  box-shadow: inset 0 0 40px rgba(255,215,0,0.07);
}
.blue-wrap .card-inner {
  box-shadow: inset 0 0 30px rgba(0,191,255,0.07);
}

/* ── PDF CANVAS ── */
.pdf-canvas {
  width: 100%;
  display: block;
}

/* ── ANIMATIONS ── */
@keyframes spinBorder {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes floatIn {
  from { opacity: 0; transform: translateY(40px); }
  to   { opacity: 1; transform: translateY(0); }
}
.gold-wrap { animation: floatIn 0.8s ease forwards; }
.blue-wrap {
  opacity: 0;
  animation: floatIn 0.6s ease forwards;
  animation-delay: calc(var(--i, 0) * 0.15s);
}

/* ── SOCIAL FOOTER ── */
.social-footer {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 16px 24px;
  margin: 60px auto 10px;
  max-width: 800px;
}
.social-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #ffffffaa;
  text-decoration: none;
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  transition: color 0.3s, transform 0.3s, text-shadow 0.3s, filter 0.3s;
}
.social-link:hover {
  transform: translateY(-2px);
}
.social-link:nth-child(1) svg { filter: drop-shadow(0 0 5px #0088cc88); }
.social-link:nth-child(2) svg { filter: drop-shadow(0 0 5px #0088cc88); }
.social-link:nth-child(3) svg { filter: drop-shadow(0 0 5px #E1306C88); }
.social-link:nth-child(4) svg { filter: drop-shadow(0 0 5px #FF000088); }
.social-link:nth-child(1):hover { color: #0088cc; text-shadow: 0 0 15px #0088cc, 0 0 30px #0088cc66; }
.social-link:nth-child(2):hover { color: #0088cc; text-shadow: 0 0 15px #0088cc, 0 0 30px #0088cc66; }
.social-link:nth-child(3):hover { color: #E1306C; text-shadow: 0 0 15px #E1306C, 0 0 30px #E1306C66; }
.social-link:nth-child(4):hover { color: #FF0000; text-shadow: 0 0 15px #FF0000, 0 0 30px #FF000066; }
.social-link:nth-child(1):hover svg { filter: drop-shadow(0 0 10px #0088cc) drop-shadow(0 0 20px #0088cc66); }
.social-link:nth-child(2):hover svg { filter: drop-shadow(0 0 10px #0088cc) drop-shadow(0 0 20px #0088cc66); }
.social-link:nth-child(3):hover svg { filter: drop-shadow(0 0 10px #E1306C) drop-shadow(0 0 20px #E1306C66); }
.social-link:nth-child(4):hover svg { filter: drop-shadow(0 0 10px #FF0000) drop-shadow(0 0 20px #FF000066); }

/* ── MEDIA QUERIES ── */
@media (max-width: 600px) {
  body { padding: 20px 12px; }
  .page-title {
    font-size: 24px;
    letter-spacing: 4px;
    margin-bottom: 30px;
  }
  .teacher-section { gap: 20px; margin-bottom: 40px; }
  .student-section { gap: 20px; }
  .section-title { font-size: 11px; letter-spacing: 3px; margin-bottom: 20px; }
  .gold-wrap { flex: 1 1 100%; max-width: 100%; }
  .blue-wrap { max-width: 100%; }
  .card-label { font-size: 9px; padding: 10px 6px; }
  .card-name { font-size: 11px; }
}
</style>
</head>
<body>

<div class="page-title">NATIJALAR</div>

<!-- TEACHER CARDS -->
{% if teachers %}
<div class="section-title gold">— O'qituvchi natijalari —</div>
<div class="teacher-section">
  {% for pdf in teachers %}
  <div class="card-wrap gold-wrap">
    <div class="spinner"></div>
    <div class="card-inner">
      <canvas class="pdf-canvas"
              data-pdf="/static/pdfs/{{ pdf }}"
              data-type="teacher"></canvas>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}

<!-- STUDENT CARDS -->
{% if students %}
<div class="section-title blue">— O'quvchilar sertifikatlari —</div>
<div class="student-section">
  {% for pdf in students %}
  <div class="card-wrap blue-wrap" style="--i: {{ loop.index }}">
    <div class="spinner"></div>
    <div class="card-inner">
      <canvas class="pdf-canvas"
              data-pdf="/static/pdfs/{{ pdf }}"
              data-type="student"></canvas>
    </div>
  </div>
  {% endfor %}
</div>

<script>
document.querySelectorAll('.pdf-canvas').forEach(function(canvas) {
  var url = canvas.getAttribute('data-pdf');
  var type = canvas.getAttribute('data-type');

  pdfjsLib.getDocument(url).promise.then(function(pdf) {
    return pdf.getPage(1);
  }).then(function(page) {
    var desiredWidth = type === 'teacher' ? 380 : 260;
    var dpr = window.devicePixelRatio || 1;
    var viewport = page.getViewport({ scale: 1 });
    var scale = (desiredWidth * dpr) / viewport.width;
    var scaledViewport = page.getViewport({ scale: scale });

    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;
    canvas.style.width = '100%';

    page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: scaledViewport
    });
  });
});
</script>
